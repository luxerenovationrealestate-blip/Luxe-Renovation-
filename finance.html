<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luxe Renovation – Финансы & Аналитика</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#f4f1ea; --card:#ffffff; --line:#e2dbc8; --tx:#1c2622; --mu:#6b7280; --g:#12302a; --gold:#a8844a; --green:#10b981; --red:#ef4444; }
* { box-sizing: border-box; font-family: Inter, sans-serif; }
body { margin: 0; background: var(--bg); color: var(--tx); padding: 20px; }
.container { max-width: 1000px; margin: 0 auto; }

/* Auth Lock */
#auth-modal { position: fixed; inset: 0; background: var(--g); display: flex; align-items: center; justify-content: center; z-index: 999; }
.auth-box { background: var(--card); padding: 32px; border-radius: 20px; text-align: center; max-width: 360px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
.auth-box h2 { font-family: 'Cormorant Garamond', serif; color: var(--g); margin: 0 0 10px; font-size: 28px; }
.auth-box input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; text-align: center; font-size: 18px; margin: 15px 0; }
.auth-box button { width: 100%; background: var(--gold); color: #fff; border: 0; padding: 12px; border-radius: 10px; font-weight: 500; cursor: pointer; }

/* Header & Nav */
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--g); margin: 0; }
.month-select { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; background: #fff; }

/* Financial Cards */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.stat-card small { color: var(--mu); font-size: 13px; font-weight: 500; text-transform: uppercase; }
.stat-card .amount { font-size: 28px; font-weight: 600; margin-top: 6px; }
.stat-card.profit .amount { color: var(--green); }
.stat-card.loss .amount { color: var(--red); }

/* Forms & Tables */
.grid-2 { display: grid; grid-template-columns: 1fr 1.5fr; gap: 24px; }
@media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 24px; }
.card h3 { margin: 0 0 16px; font-size: 20px; color: var(--g); font-family: 'Cormorant Garamond', serif; }

form { display: grid; gap: 12px; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.btn { background: var(--g); color: #fff; border: 0; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn-gold { background: var(--gold); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; }
th { color: var(--mu); font-weight: 500; }
.badge { padding: 3px 8px; border-radius: 6px; font-size: 12px; background: #eee; }
.receipt-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; cursor: pointer; }
</style>
</head>
<body>

<!-- Lock Screen -->
<div id="auth-modal">
  <div class="auth-box">
    <h2>Luxe Finance</h2>
    <p style="color:var(--mu); font-size:14px; margin:0;">
